<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Growth - Learning Portal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght:500;700;900&family=Rajdhani:wght:400;500;600;700&display=swap');

        :root {
            --primary-blue: #0a4d8f;
            --deep-blue: #041e42;
            --electric-blue: #00d4ff;
            --cyber-blue: #4dd0e1;
            --dark-bg: #0a0e1a;
            --darker-bg: #050810;
            --card-bg: rgba(10, 30, 60, 0.85);
            --glow-blue: rgba(0, 212, 255, 0.3);
            --accent-gold: #ffd700;
            --success-green: #00ff88;
            --error-red: #ff3366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--deep-blue) 50%, var(--dark-bg) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(10, 77, 143, 0.15) 0%, transparent 50%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 212, 255, 0.03) 2px, rgba(0, 212, 255, 0.03) 4px);
            pointer-events: none;
            z-index: 1;
        }

        #app {
            position: relative;
            z-index: 2;
            min-height: 100vh;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: var(--card-bg);
            border: 2px solid var(--primary-blue);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
            backdrop-filter: blur(20px);
            box-shadow: 
                0 0 40px var(--glow-blue),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--electric-blue), var(--cyber-blue), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px var(--glow-blue);
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 10px;
        }

        .logo-subtitle {
            font-size: 14px;
            color: var(--cyber-blue);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .login-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-button {
            flex: 1;
            padding: 14px;
            background: rgba(10, 77, 143, 0.3);
            border: 2px solid transparent;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-button:hover {
            background: rgba(10, 77, 143, 0.5);
            border-color: var(--cyber-blue);
            color: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--deep-blue));
            border-color: var(--electric-blue);
            color: #ffffff;
            box-shadow: 0 4px 20px var(--glow-blue);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--cyber-blue);
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            background: rgba(5, 8, 16, 0.8);
            border: 2px solid rgba(77, 208, 225, 0.3);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--electric-blue);
            background: rgba(5, 8, 16, 0.95);
            box-shadow: 0 0 20px var(--glow-blue);
        }

        .login-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-blue), var(--electric-blue));
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--glow-blue);
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(0, 212, 255, 0.6);
        }

        .error-message {
            color: var(--error-red);
            text-align: center;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            padding: 25px 35px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 2px solid var(--primary-blue);
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .welcome-section h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--electric-blue), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }

        .welcome-section .subtitle {
            color: var(--cyber-blue);
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .logout-button {
            padding: 12px 28px;
            background: rgba(255, 51, 102, 0.2);
            border: 2px solid var(--error-red);
            border-radius: 10px;
            color: var(--error-red);
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-button:hover {
            background: var(--error-red);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 51, 102, 0.4);
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 30px;
        }

        .subject-card {
            background: var(--card-bg);
            border: 2px solid var(--primary-blue);
            border-radius: 24px;
            padding: 40px 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .subject-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--electric-blue);
            box-shadow: 0 20px 60px var(--glow-blue);
        }

        .subject-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: block;
            filter: drop-shadow(0 4px 10px rgba(0, 212, 255, 0.4));
        }

        .subject-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: var(--electric-blue);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subject-card p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            line-height: 1.6;
            font-weight: 500;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-badge {
            background: var(--card-bg);
            border: 2px solid var(--primary-blue);
            border-radius: 16px;
            padding: 20px 35px;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .stat-badge:hover {
            transform: translateY(-5px);
            border-color: var(--electric-blue);
            box-shadow: 0 12px 40px var(--glow-blue);
        }

        .stat-icon {
            font-size: 40px;
            filter: drop-shadow(0 0 10px var(--glow-blue));
        }

        .stat-content h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: var(--electric-blue);
            text-shadow: 0 0 15px var(--glow-blue);
            margin-bottom: 5px;
            line-height: 1;
        }

        .stat-content p {
            color: var(--cyber-blue);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin: 0;
        }

        .coin-breakdown {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
        }

        .coin-breakdown span {
            background: rgba(77, 208, 225, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(77, 208, 225, 0.3);
        }

        /* Math Question Styles */
        .question-container {
            background: var(--card-bg);
            border: 2px solid var(--primary-blue);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 24px;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .answer-input {
            width: 100%;
            max-width: 300px;
            padding: 18px 24px;
            background: rgba(5, 8, 16, 0.8);
            border: 2px solid var(--cyber-blue);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: var(--electric-blue);
            box-shadow: 0 0 20px var(--glow-blue);
        }

        .answer-choices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .choice-button {
            padding: 20px;
            background: rgba(10, 77, 143, 0.3);
            border: 2px solid var(--cyber-blue);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .choice-button:hover {
            background: var(--primary-blue);
            border-color: var(--electric-blue);
            transform: scale(1.05);
            box-shadow: 0 5px 20px var(--glow-blue);
        }

        .choice-button.selected {
            background: linear-gradient(135deg, var(--primary-blue), var(--electric-blue));
            border-color: var(--electric-blue);
            box-shadow: 0 0 20px var(--glow-blue);
        }

        .choice-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .help-button {
            padding: 16px 30px;
            background: linear-gradient(135deg, var(--accent-gold), #ffed4e);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            color: var(--darker-bg);
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .help-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.5);
        }

        .submit-button {
            padding: 16px 30px;
            background: linear-gradient(135deg, var(--primary-blue), var(--electric-blue));
            border: 2px solid var(--electric-blue);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .submit-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 212, 255, 0.6);
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .next-button {
            padding: 16px 30px;
            background: linear-gradient(135deg, var(--success-green), #00cc70);
            border: 2px solid var(--success-green);
            border-radius: 12px;
            color: var(--darker-bg);
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .next-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(0, 255, 136, 0.5);
        }

        .help-panel {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 237, 78, 0.1));
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            padding: 25px;
            margin: 25px 0;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .help-panel h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            color: var(--accent-gold);
            margin-bottom: 15px;
        }

        .help-panel p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            line-height: 1.8;
        }

        .help-panel strong {
            color: var(--accent-gold);
            font-weight: 900;
        }

        .help-panel em {
            color: var(--electric-blue);
            font-style: italic;
        }

        .feedback-correct {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border: 2px solid var(--success-green);
            border-radius: 16px;
            padding: 25px;
            margin: 25px 0;
            animation: celebrationPulse 0.6s ease-out;
        }

        .feedback-incorrect {
            background: linear-gradient(135deg, rgba(255, 51, 102, 0.2), rgba(255, 51, 102, 0.1));
            border: 2px solid var(--error-red);
            border-radius: 16px;
            padding: 25px;
            margin: 25px 0;
            animation: shake 0.5s ease-out;
        }

        @keyframes celebrationPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .feedback-text {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
        }

        .feedback-correct .feedback-text {
            color: var(--success-green);
        }

        .feedback-incorrect .feedback-text {
            color: var(--error-red);
        }

        .feedback-explanation {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            line-height: 1.6;
        }

        /* Vertical Math Format */
        .vertical-math {
            font-family: 'Courier New', monospace;
            font-size: 32px;
            font-weight: 700;
            text-align: right;
            background: rgba(5, 8, 16, 0.8);
            border: 2px solid var(--cyber-blue);
            border-radius: 12px;
            padding: 30px;
            margin: 20px auto;
            max-width: 300px;
            color: var(--electric-blue);
            line-height: 1.5;
        }

        .vertical-math .operator {
            color: var(--accent-gold);
        }

        .vertical-math .line {
            border-top: 3px solid var(--electric-blue);
            margin: 10px 0;
        }

        /* Long Division Bracket */
        .long-division {
            font-family: 'Courier New', monospace;
            font-size: 28px;
            font-weight: 700;
            background: rgba(5, 8, 16, 0.8);
            border: 2px solid var(--cyber-blue);
            border-radius: 12px;
            padding: 30px;
            margin: 20px auto;
            max-width: 400px;
            color: var(--electric-blue);
        }

        .long-division .bracket {
            display: inline-block;
            border-left: 3px solid var(--accent-gold);
            border-top: 3px solid var(--accent-gold);
            padding: 5px 15px 5px 15px;
            margin-left: 10px;
        }

        /* Timer Display */
        .timer-display {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary-blue), var(--electric-blue));
            border: 3px solid var(--electric-blue);
            border-radius: 16px;
            padding: 15px 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            box-shadow: 0 0 30px var(--glow-blue);
            z-index: 1000;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .timer-display.warning {
            background: linear-gradient(135deg, var(--error-red), #ff6b6b);
            border-color: var(--error-red);
            animation: shake 0.5s ease-in-out infinite;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease-out;
        }

        .modal-content {
            background: var(--card-bg);
            border: 3px solid var(--electric-blue);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            color: var(--electric-blue);
            margin-bottom: 30px;
            text-align: center;
        }

        .option-group {
            margin-bottom: 25px;
        }

        .option-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            color: var(--cyber-blue);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .option-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option-button {
            flex: 1;
            min-width: 80px;
            padding: 12px 20px;
            background: rgba(10, 77, 143, 0.3);
            border: 2px solid var(--cyber-blue);
            border-radius: 10px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-button:hover {
            background: var(--primary-blue);
            transform: translateY(-2px);
        }

        .option-button.selected {
            background: linear-gradient(135deg, var(--primary-blue), var(--electric-blue));
            border-color: var(--electric-blue);
            box-shadow: 0 0 20px var(--glow-blue);
        }

        .interactive-number-line {
            margin: 30px 0;
            padding: 30px;
            background: rgba(10, 30, 60, 0.6);
            border: 2px solid var(--cyber-blue);
            border-radius: 16px;
        }

        .number-line-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: var(--electric-blue);
            margin-bottom: 20px;
            text-align: center;
        }

        .number-line-svg {
            width: 100%;
            height: 120px;
        }

        .content-card {
            background: var(--card-bg);
            border: 2px solid var(--primary-blue);
            border-radius: 24px;
            padding: 50px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .success-message {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 136, 0.1));
            border: 2px solid var(--success-green);
            border-radius: 12px;
            padding: 20px;
            color: var(--success-green);
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .subject-grid {
                grid-template-columns: 1fr;
            }
            
            .dashboard-header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

                            : `${result}/${denominator}`;
                        
                        const estimate = Math.round((numerator / denominator) * whole);
                        
                        return {
                            text: `Estimate, then calculate: ${numerator}/${denominator} × ${whole} = ?`,
                            answer: `${result}/${denominator}`,
                            hint: `Estimate first: ${numerator}/${denominator} is about ${Math.round((numerator/denominator)*10)/10}, times ${whole} ≈ ${estimate}`,
                            hint2: `<strong>Estimate then multiply:</strong><br/><strong>Estimate:</strong> ${numerator}/${denominator} ≈ ${(numerator/denominator).toFixed(2)}, so ${numerator}/${denominator} × ${whole} ≈ ${estimate}<br/><strong>Calculate:</strong><br/><strong>Step 1:</strong> Multiply numerator: ${numerator} × ${whole} = ${result}<br/><strong>Step 2:</strong> Keep denominator: ${denominator}${result >= denominator ? `<br/><em>As mixed number: ${simplified}</em>` : ''}`,
                            useNumberLine: false
                        };
                    } else {
                        // Estimate then divide proper fraction by whole number
                        const numerator = rand(3, 11);
                        const denominator = rand(numerator + 1, 15);
                        const whole = rand(2, 5);
                        const newDenom = denominator * whole;
                        
                        const estimate = (numerator / denominator / whole).toFixed(2);
                        
                        return {
                            text: `Estimate, then calculate: ${numerator}/${denominator} ÷ ${whole} = ?`,
                            answer: `${numerator}/${newDenom}`,
                            hint: `Estimate: ${numerator}/${denominator} is about ${(numerator/denominator).toFixed(2)}, divided by ${whole} ≈ ${estimate}`,
                            hint2: `<strong>Estimate then divide:</strong><br/><strong>Estimate:</strong> ${numerator}/${denominator} ≈ ${(numerator/denominator).toFixed(2)}, divided by ${whole} ≈ ${estimate}<br/><strong>Calculate:</strong><br/><strong>Step 1:</strong> Keep numerator: ${numerator}<br/><strong>Step 2:</strong> Multiply denominator: ${denominator} × ${whole} = ${newDenom}<br/><em>Check: ${(numerator/newDenom).toFixed(3)} is close to ${estimate}!</em>`,
                            useNumberLine: false
                        };
                    }
                }
            }
            
            if (topicId === 'decimals') {
                let a, b, operation;
                
                if (level === 'beginner') {
                    // Adding/subtracting decimals with 1 decimal place
                    a = (rand(10, 99) + rand(1, 9) / 10).toFixed(1);
                    b = (rand(10, 99) + rand(1, 9) / 10).toFixed(1);
                    operation = Math.random() > 0.5 ? 'add' : 'subtract';
                } else if (level === 'intermediate') {
                    // 2 decimal places, all operations
                    a = (rand(10, 199) + rand(1, 99) / 100).toFixed(2);
                    b = (rand(5, 99) + rand(1, 99) / 100).toFixed(2);
                    const ops = ['add', 'subtract', 'multiply'];
                    operation = ops[rand(0, ops.length - 1)];
                } else { // expert
                    // Complex: division, mixed decimal places, larger numbers
                    a = (rand(50, 999) + rand(1, 99) / 100).toFixed(2);
                    b = (rand(2, 50) + rand(1, 9) / 10).toFixed(1);
                    const ops = ['add', 'subtract', 'multiply', 'divide'];
                    operation = ops[rand(0, ops.length - 1)];
                }
                
                let answer, symbol, hint, hint2;
                
                if (operation === 'add') {
                    answer = (parseFloat(a) + parseFloat(b)).toFixed(2);
                    symbol = '+';
                    hint = 'Line up the decimal points and add like whole numbers';
                    hint2 = `<strong>Adding decimals:</strong><br/><strong>Step 1:</strong> Line up: ${a}<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+ ${b}<br/><strong>Step 2:</strong> Add from right to left<br/>`;
                } else if (operation === 'subtract') {
                    // Make sure a > b
                    if (parseFloat(a) < parseFloat(b)) {
                        [a, b] = [b, a];
                    }
                    answer = (parseFloat(a) - parseFloat(b)).toFixed(2);
                    symbol = '-';
                    hint = 'Line up decimal points, borrow if needed';
                    hint2 = `<strong>Subtracting decimals:</strong><br/><strong>Step 1:</strong> Line up: ${a}<br/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- ${b}<br/><strong>Step 2:</strong> Subtract, borrow when needed<br/>`;
                } else if (operation === 'multiply') {
                    answer = (parseFloat(a) * parseFloat(b)).toFixed(2);
                    symbol = '×';
                    hint = 'Multiply as whole numbers, then count total decimal places';
                    hint2 = `<strong>Multiplying decimals:</strong><br/><strong>Step 1:</strong> Ignore decimals, multiply: ${a.replace('.', '')} × ${b.replace('.', '')}<br/><strong>Step 2:</strong> Count decimal places in both numbers<br/><strong>Step 3:</strong> Place decimal in answer<br/>`;
                } else { // divide
                    answer = (parseFloat(a) / parseFloat(b)).toFixed(2);
                    symbol = '÷';
                    hint = 'Move decimal in divisor to make it whole, move same in dividend';
                    hint2 = `<strong>Dividing decimals:</strong><br/><strong>Step 1:</strong> Make divisor whole: ${b} → ${parseFloat(b) * 10}<br/><strong>Step 2:</strong> Do same to dividend: ${a} → ${parseFloat(a) * 10}<br/><strong>Step 3:</strong> Divide normally<br/>`;
                }
                
                return {
                    text: `${a} ${symbol} ${b} = ?`,
                    answer: answer,
                    hint: hint,
                    hint2: hint2,
                    useNumberLine: false
                };
            }
            
            if (topicId === 'division') {
                let divisor, quotient, dividend;
                
                if (level === 'beginner') {
                    // 2-digit ÷ 1-digit with remainder possibilities
                    divisor = rand(3, 9);
                    quotient = rand(5, 15);
                    const addRemainder = Math.random() > 0.6;
                    dividend = (divisor * quotient) + (addRemainder ? rand(1, divisor - 1) : 0);
                } else if (level === 'intermediate') {
                    // 3-digit ÷ 1-digit or 2-digit ÷ 2-digit
                    if (Math.random() > 0.5) {
                        divisor = rand(6, 12);
                        quotient = rand(15, 85);
                    } else {
                        divisor = rand(11, 25);
                        quotient = rand(8, 45);
                    }
                    const addRemainder = Math.random() > 0.5;
                    dividend = (divisor * quotient) + (addRemainder ? rand(1, divisor - 1) : 0);
                } else { // expert
                    // 4-digit ÷ 2-digit OR decimals
                    const useDecimals = Math.random() > 0.6;
                    if (useDecimals) {
                        divisor = rand(2, 12);
                        quotient = rand(5, 50);
                        dividend = divisor * quotient;
                        const decimalAnswer = (dividend / divisor).toFixed(2);
                        return {
                            text: `${dividend} ÷ ${divisor} = ? (to 2 decimal places)`,
                            answer: decimalAnswer,
                            hint: 'Divide normally, then place the decimal point',
                            hint2: `<strong>Decimal Division:</strong><br/><strong>Step 1:</strong> Divide ${dividend} ÷ ${divisor}<br/><strong>Step 2:</strong> Place decimal if needed<br/>`,
                            useNumberLine: false,
                            showLongDivision: false
                        };
                    } else {
                        divisor = rand(15, 35);
                        quotient = rand(25, 150);
                        const addRemainder = Math.random() > 0.4;
                        dividend = (divisor * quotient) + (addRemainder ? rand(1, divisor - 1) : 0);
                    }
                }
                
                const remainder = dividend % divisor;
                const actualQuotient = Math.floor(dividend / divisor);
                const answer = remainder > 0 ? `${actualQuotient} R${remainder}` : actualQuotient;
                
                return {
                    text: `Solve this division problem:`,
                    longDivision: { divisor, dividend },
                    answer: answer.toString(),
                    hint: `Think: ${divisor} times what equals ${dividend}? Don't forget the remainder!`,
                    hint2: `<strong>Long Division:</strong><br/><strong>Step 1:</strong> How many ${divisor}s fit into ${dividend}?<br/><strong>Step 2:</strong> ${divisor} × ${actualQuotient} = ${divisor * actualQuotient}<br/>${remainder > 0 ? `<strong>Step 3:</strong> Remainder: ${dividend} - ${divisor * actualQuotient} = ${remainder}<br/>` : ''}`,
                    useNumberLine: false,
                    showLongDivision: true
                };
            }
            
            return { 
                text: `This topic is coming soon! Click back to try another topic.`, 
                answer: 0, 
                hint: 'More topics are being added!',
                hint2: '<strong>Stay tuned!</strong><br/>We\'re adding more topics soon.' 
            };
        };

            const minuteAngle = minute * 6;

                { num: 3, top: '50%', right: '8%', transform: 'translateY(-50%)' },
                { num: 6, bottom: '8%', left: '50%', transform: 'translateX(-50%)' },
                { num: 9, top: '50%', left: '8%', transform: 'translateY(-50%)' }
            ];

            return (
                <div style={{
                    width: '280px',
                    height: '280px',
                    margin: '30px auto',
                    position: 'relative'
                }}>
                    <div style={{
                        width: '100%',
                        height: '100%',
                        borderRadius: '50%',
                        background: 'radial-gradient(circle, rgba(10, 30, 60, 0.95) 0%, rgba(5, 15, 30, 0.98) 100%)',

                    }}>

                                textShadow: '0 0 10px var(--glow-blue)',
                                ...style
                            }}>
                                {num}
                            </div>
                        ))}
                        
                        {/* Hour markers */}
                        {Array.from({ length: 12 }, (_, i) => (
                            <div key={`h${i}`} style={{
                                position: 'absolute',
                                width: '3px',
                                height: '15px',
                                background: 'var(--cyber-blue)',
                                top: '10px',
                                left: '50%',
                                transform: `translateX(-50%) rotate(${i * 30}deg)`,

        // Interactive Number Line Component
        function InteractiveNumberLine({ min, max, useIntegerLine }) {
            const range = max - min;
            // Use 1s for ranges up to 60, then 5s, then 10s
            const step = range <= 60 ? 1 : range <= 100 ? 5 : 10;
            
            return (
                <div className="interactive-number-line">
                    <div className="number-line-title">
                        📏 {useIntegerLine ? 'Integer Line (Positive & Negative)' : 'Number Line Helper'}
                    </div>
                    <svg className="number-line-svg" viewBox="0 0 1000 120">
                        <line x1="50" y1="60" x2="950" y2="60" stroke="var(--electric-blue)" strokeWidth="4" />
                        
                        {/* Zero marker for integer line */}
                        {useIntegerLine && min < 0 && max > 0 && (
                            <g>
                                <line 
                                    x1={50 + (Math.abs(min) / range) * 900} 
                                    y1="45" 
                                    x2={50 + (Math.abs(min) / range) * 900} 
                                    y2="75" 
                                    stroke="var(--accent-gold)" 
                                    strokeWidth="5"
                                />
                                <text 
                                    x={50 + (Math.abs(min) / range) * 900} 
                                    y="35" 
                                    textAnchor="middle" 
                                    fill="var(--accent-gold)"
                                    fontSize="16"
                                    fontFamily="'Orbitron', sans-serif"
                                    fontWeight="900"
                                >
                                    0
                                </text>
                            </g>
                        )}
                        
                        {Array.from({ length: Math.floor(range / step) + 1 }, (_, i) => {
                            const value = min + (i * step);
                            const x = 50 + (i * (900 / Math.floor(range / step)));
                            const isZero = value === 0;
                            
                            if (useIntegerLine && isZero) return null;
                            
                            return (
                                <g key={i}>
                                    <line 
                                        x1={x} y1="50" x2={x} y2="70" 
                                        stroke={value < 0 ? 'var(--error-red)' : 'var(--cyber-blue)'} 
                                        strokeWidth="2" 
                                    />
                                    <text 
                                        x={x} y="95" textAnchor="middle" 
                                        fill={value < 0 ? 'var(--error-red)' : 'var(--cyber-blue)'} 
                                        fontSize="12" 
                                        fontFamily="'Orbitron', sans-serif" 
                                        fontWeight="700"
                                    >
                                        {value}
                                    </text>
                                </g>
                            );
                        })}
                    </svg>
                    {useIntegerLine && (
                        <div style={{ 
                            display: 'flex', 
                            justifyContent: 'center', 
                            gap: '30px', 
                            marginTop: '15px',
                            fontSize: '14px',
                            fontWeight: '600'
                        }}>
                            <span style={{ color: 'var(--error-red)' }}>← Negative Numbers</span>
                            <span style={{ color: 'var(--accent-gold)' }}>Zero</span>
                            <span style={{ color: 'var(--cyber-blue)' }}>Positive Numbers →</span>
                        </div>
                    )}
                </div>
            );
        }

        // Question Component
        function MathQuestion({ question, onAnswer, onNext, isCorrect }) {
            const [answer, setAnswer] = useState('');
            const [selectedChoice, setSelectedChoice] = useState(null);
            const [showHelp, setShowHelp] = useState(false);
            const [helpLevel, setHelpLevel] = useState(1);

            const handleSubmit = () => {
                if (question.isMultipleChoice) {
                    onAnswer(selectedChoice === question.correctChoice ? question.answer : 'wrong');
                } else {
                    onAnswer(answer);
                }
            };

            const toggleHelp = () => {
                if (!showHelp) {
                    setShowHelp(true);
                    setHelpLevel(1);
                } else if (helpLevel === 1 && question.hint2) {
                    setHelpLevel(2);
                } else {
                    setShowHelp(false);
                    setHelpLevel(1);
                }
            };

            return (
                <div className="question-container">
                    <div className="question-text">{question.text}</div>

                    {/* Show analog clock for time questions */}
                    {question.useClock && question.clockTime && (
                        <AnalogClock hour={question.clockTime.hour} minute={question.clockTime.minute} />
                    )}

                    {/* Show vertical math format */}
                    {question.showVertical && question.verticalFormat && (
                        <div className="vertical-math">
                            <div>{question.verticalFormat.top}</div>
                            <div><span className="operator">{question.verticalFormat.operator}</span> {question.verticalFormat.bottom}</div>
                            <div className="line"></div>
                            <div>?</div>
                        </div>
                    )}

                    {/* Show long division bracket */}
                    {question.showLongDivision && question.longDivision && (
                        <div className="long-division">
                            <span>{question.longDivision.divisor}</span>
                            <span className="bracket">{question.longDivision.dividend}</span>
                        </div>
                    )}

                    {question.isMultipleChoice ? (
                        <div className="answer-choices">
                            {question.choices.map((choice, idx) => (
                                <button
                                    key={idx}
                                    className={`choice-button ${selectedChoice === idx ? 'selected' : ''}`}
                                    onClick={() => setSelectedChoice(idx)}
                                    disabled={isCorrect !== null}
                                >
                                    {choice}
                                </button>
                            ))}
                        </div>
                    ) : (
                        <div style={{ marginBottom: '20px' }}>
                            <input 
                                type="text"
                                className="answer-input"
                                value={answer}
                                onChange={(e) => setAnswer(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && answer && isCorrect === null && handleSubmit()}
                                placeholder="Your answer..."
                                disabled={isCorrect !== null}
                            />
                        </div>
                    )}

                    {question.useNumberLine && !isCorrect && (
                        <InteractiveNumberLine 
                            min={question.numberLineRange[0]} 
                            max={question.numberLineRange[1]}
                            useIntegerLine={question.useIntegerLine || false}
                        />
                    )}

                    {showHelp && (
                        <div className="help-panel">
                            <h3>{helpLevel === 1 ? '💡 Hint #1' : '📖 Detailed Steps'}</h3>
                            {helpLevel === 1 ? (
                                <p>{question.hint}</p>
                            ) : (
                                <div style={{ 
                                    color: 'rgba(255,255,255,0.9)', 
                                    fontSize: '16px', 
                                    lineHeight: '1.8' 
                                }} dangerouslySetInnerHTML={{ __html: question.hint2 }} />
                            )}
                            {helpLevel === 1 && question.hint2 && (
                                <p style={{ marginTop: '15px', fontSize: '14px', color: 'rgba(255,255,255,0.7)', fontStyle: 'italic' }}>
                                    💡 Click "More Help" again for step-by-step instructions
                                </p>
                            )}
                        </div>
                    )}

                    {isCorrect === true && (
                        <div className="feedback-correct">
                            <div className="feedback-text">🎉 Excellent work! That's correct!</div>
                            <div className="feedback-explanation">The answer is {question.answer}. You earned 5 coins! 🪙</div>
                        </div>
                    )}

                    {isCorrect === false && (
                        <div className="feedback-incorrect">
                            <div className="feedback-text">Not quite right. Let's try again!</div>
                            <div className="feedback-explanation">{question.hint}</div>
                        </div>
                    )}

                    <div className="action-buttons">
                        {isCorrect === null && (
                            <>
                                <button className="help-button" onClick={toggleHelp}>
                                    {!showHelp ? '💡 Need Help?' : helpLevel === 1 ? '📖 More Help' : '🙈 Hide Help'}
                                </button>
                                <button 
                                    className="submit-button" 
                                    onClick={handleSubmit} 
                                    disabled={!answer && selectedChoice === null}
                                >
                                    ✓ Submit Answer
                                </button>
                            </>
                        )}
                        {isCorrect !== null && (
                            <button className="next-button" onClick={() => {
                                setAnswer('');
                                setSelectedChoice(null);
                                setShowHelp(false);
                                setHelpLevel(1);
                                onNext();
                            }}>
                                {isCorrect ? '→ Next Question' : '↻ Try Again'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // Simple Math Quest Component - just shows topics for now
        function MathQuest({ user, onBack }) {
            const [selectedTopic, setSelectedTopic] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [practiceSettings, setPracticeSettings] = useState(null);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [questionNumber, setQuestionNumber] = useState(1);
            const [isCorrect, setIsCorrect] = useState(null);
            const [coins, setCoins] = useState(0);
            const [topicProgress, setTopicProgress] = useState(null);
            const [timeRemaining, setTimeRemaining] = useState(null);
            const [timerActive, setTimerActive] = useState(false);

            // Timer countdown
            useEffect(() => {
                if (timerActive && timeRemaining > 0) {
                    const timer = setInterval(() => {
                        setTimeRemaining(prev => {
                            if (prev <= 1) {
                                setTimerActive(false);
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                    return () => clearInterval(timer);
                }
            }, [timerActive, timeRemaining]);

            const handleTopicClick = (topic) => {
                setSelectedTopic(topic);
                setShowSettings(true);
            };

            const handleStartPractice = (settings) => {
                setPracticeSettings(settings);
                setShowSettings(false);
                
                const progress = getTopicProgress(user.username, selectedTopic.id);
                setTopicProgress(progress);
                
                if (settings.mode === 'time') {
                    setTimeRemaining(settings.timeLimit * 60); // Convert to seconds
                    setTimerActive(true);
                }
                
                const question = generateQuestion(selectedTopic.id, progress.currentLevel);
                setCurrentQuestion(question);
                setQuestionNumber(1);
                setCoins(0);
            };

            useEffect(() => {
                if (selectedTopic && !showSettings && practiceSettings) {
                    const progress = getTopicProgress(user.username, selectedTopic.id);
                    setTopicProgress(progress);
                    const question = generateQuestion(selectedTopic.id, progress.currentLevel);
                    setCurrentQuestion(question);
                }
            }, [selectedTopic]);

            const handleAnswer = (userAnswer) => {
                // Normalize answers - remove all spaces and compare
                const normalizedUser = String(userAnswer).trim().replace(/\s+/g, '');
                const normalizedCorrect = String(currentQuestion.answer).trim().replace(/\s+/g, '');
                
                const correct = normalizedUser === normalizedCorrect;
                setIsCorrect(correct);
                
                const newProgress = updateTopicProgress(user.username, selectedTopic.id, correct);
                setTopicProgress(newProgress);
                
                if (correct) {
                    setCoins(coins + selectedTopic.coinsPerQuestion);
                    
                    const stats = getUserStats(user.username);
                    stats.mathCoins += selectedTopic.coinsPerQuestion;
                    stats.totalCoins += selectedTopic.coinsPerQuestion;
                    storage.set(`stats_${user.username}`, stats);
                }
            };

            const handleNext = () => {
                if (isCorrect) {
                    // Check if practice session is complete
                    if (practiceSettings.mode === 'questions' && questionNumber >= practiceSettings.questionCount) {
                        // Session complete!
                        setSelectedTopic(null);
                        setPracticeSettings(null);
                        setTimerActive(false);
                        return;
                    }
                    
                    if (practiceSettings.mode === 'time' && timeRemaining <= 0) {
                        // Time's up!
                        setSelectedTopic(null);
                        setPracticeSettings(null);
                        setTimerActive(false);
                        return;
                    }
                    
                    // Speed Drill: check if reached question limit
                    if (practiceSettings.isSpeedDrill && questionNumber >= practiceSettings.questionCount) {
                        // Speed Drill complete!
                        setSelectedTopic(null);
                        setPracticeSettings(null);
                        setTimerActive(false);
                        return;
                    }
                    
                    setQuestionNumber(questionNumber + 1);
                    const question = generateQuestion(selectedTopic.id, topicProgress.currentLevel);
                    setCurrentQuestion(question);
                }
                setIsCorrect(null);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            if (showSettings && selectedTopic) {
                return (
                    <PracticeSettings 
                        topic={selectedTopic}
                        onStart={handleStartPractice}
                        onCancel={() => {
                            setShowSettings(false);
                            setSelectedTopic(null);
                        }}
                    />
                );
            }

            if (selectedTopic && topicProgress && practiceSettings) {
                const levelData = topicProgress[topicProgress.currentLevel];
                const levelAccuracy = levelData.answered > 0 
                    ? Math.round((levelData.correct / levelData.answered) * 100)
                    : 0;
                
                return (

                        {/* Timer Display */}
                        {practiceSettings.mode === 'time' && timeRemaining !== null && (

                                ⏱️ {formatTime(timeRemaining)}
                                {practiceSettings.isSpeedDrill && (
                                    <div style={{ fontSize: '16px', marginTop: '5px', opacity: '0.9' }}>
                                        Q {questionNumber}/{practiceSettings.questionCount}
                                    </div>
                                )}
                            </div>
                        )}
                        
                        <div className="dashboard-header">
                            <button className="logout-button" onClick={() => {
                                setSelectedTopic(null);
                                setPracticeSettings(null);
                                setTimerActive(false);
                            }}>← Back to Topics</button>
                            <div className="welcome-section">
                                <h1>{selectedTopic.icon} {selectedTopic.name}</h1>
                                <div className="subtitle">
                                    {practiceSettings.isSpeedDrill ? (
                                        <>⚡ Speed Drill Mode • {coins} coins • {questionNumber}/{practiceSettings.questionCount} questions</>
                                    ) : (
                                        <>
                                            Level: <span style={{ 
                                                color: topicProgress.currentLevel === 'beginner' ? 'var(--success-green)' : 
                                                       topicProgress.currentLevel === 'intermediate' ? 'var(--accent-gold)' : 
                                                       'var(--error-red)',
                                                textTransform: 'uppercase',
                                                fontWeight: '900'
                                            }}>
                                                {topicProgress.currentLevel}
                                            </span> • 
                                            {practiceSettings.mode === 'questions' 
                                                ? ` Q${questionNumber}/${practiceSettings.questionCount}` 
                                                : ` Q#${questionNumber}`
                                            } • {coins} coins • {levelData.answered > 0 ? Math.round((levelData.correct / levelData.answered) * 100) : 0}% accuracy
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>

                        {currentQuestion && (
                            <MathQuestion 
                                question={currentQuestion}
                                onAnswer={handleAnswer}
                                onNext={handleNext}
                                isCorrect={isCorrect}
                            />
                        )}
                    </div>
                );
            }

            return (
                <div className="dashboard">
                    <StarsBackground />
                    <div className="dashboard-header">
                        <button className="logout-button" onClick={onBack}>← Back</button>
                        <div className="welcome-section">
                            <h1>🔢 Math Quest</h1>
                            <div className="subtitle">Choose a topic, {user.name}!</div>
                        </div>
                    </div>

                    <div className="subject-grid">
                        {MATH_TOPICS.map(topic => {
                            const progress = getTopicProgress(user.username, topic.id);

                                    <h2>{topic.name}</h2>
                                    <p>+{topic.coinsPerQuestion} coins per question</p>
                                    
                                    {/* Level Badge */}
                                    <div style={{

                                        background: progress.currentLevel === 'beginner' ? 'rgba(0, 255, 136, 0.2)' :

        // Circuit Diagram Component
        function CircuitDiagram({ diagram }) {
            if (!diagram) return null;

            const { type, complete, missing, switchOpen, highlight } = diagram;

            if (type === 'simple-circuit' || type === 'incomplete-circuit') {
                const showBattery = missing !== 'battery';
                const showBulb = missing !== 'bulb';
                const isComplete = complete && !missing;

                return (
                    <svg width="400" height="300" viewBox="0 0 400 300" style={{ margin: '20px auto', display: 'block' }}>
                        {/* Background */}
                        <rect width="400" height="300" fill="rgba(10, 30, 60, 0.3)" rx="12" />
                        
                        {/* Wires forming rectangle */}
                        <line x1="100" y1="150" x2="150" y2="150" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />
                        <line x1="250" y1="150" x2="300" y2="150" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />
                        <line x1="100" y1="150" x2="100" y2="80" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />
                        <line x1="100" y1="80" x2="300" y2="80" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />
                        <line x1="300" y1="80" x2="300" y2="150" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />

                        {/* Battery */}
                        {showBattery ? (
                            <g opacity={highlight === 'battery' ? 1 : 0.9}>
                                <rect x="170" y="135" width="60" height="30" fill="#ff6b6b" stroke="#ff3333" strokeWidth="2" rx="4" />
                                <text x="200" y="155" textAnchor="middle" fill="white" fontSize="16" fontWeight="700">+  -</text>
                                <text x="200" y="180" textAnchor="middle" fill="var(--accent-gold)" fontSize="12" fontWeight="700">Battery</text>
                            </g>
                        ) : (
                            <text x="200" y="155" textAnchor="middle" fill="#ff3333" fontSize="14" fontWeight="700">??? Missing!</text>
                        )}

                        {/* Light Bulb */}
                        {showBulb ? (
                            <g opacity={highlight === 'bulb' ? 1 : 0.9}>
                                <circle cx="200" cy="80" r="25" fill={isComplete ? "#ffd700" : "#333"} 
                                        stroke={isComplete ? "#ffaa00" : "#666"} strokeWidth="3" />
                                {isComplete && (
                                    <>
                                        <line x1="190" y1="70" x2="210" y2="90" stroke="#fff" strokeWidth="2" />

                                    </>
                                )}
                                <text x="200" y="50" textAnchor="middle" fill="var(--cyber-blue)" fontSize="12" fontWeight="700">Bulb</text>
                            </g>
                        ) : null}

                        {/* Status indicator */}
                        <text x="200" y="250" textAnchor="middle" fill={isComplete ? "var(--success-green)" : "var(--error-red)"} 
                              fontSize="16" fontWeight="900">
                            {isComplete ? "✓ Circuit Complete!" : "✗ Circuit Broken"}
                        </text>
                    </svg>
                );
            }

            if (type === 'circuit-with-switch') {
                const isComplete = !switchOpen;

                return (
                    <svg width="400" height="300" viewBox="0 0 400 300" style={{ margin: '20px auto', display: 'block' }}>
                        <rect width="400" height="300" fill="rgba(10, 30, 60, 0.3)" rx="12" />
                        
                        {/* Wires */}
                        <line x1="100" y1="150" x2="140" y2="150" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />
                        <line x1="180" y1="150" x2="220" y2="150" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />
                        <line x1="260" y1="150" x2="300" y2="150" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />
                        <line x1="100" y1="150" x2="100" y2="80" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />
                        <line x1="100" y1="80" x2="300" y2="80" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />
                        <line x1="300" y1="80" x2="300" y2="150" stroke={isComplete ? "#00d4ff" : "#666"} strokeWidth="4" />

                        {/* Battery */}
                        <rect x="240" y="135" width="40" height="30" fill="#ff6b6b" stroke="#ff3333" strokeWidth="2" rx="4" />
                        <text x="260" y="155" textAnchor="middle" fill="white" fontSize="14" fontWeight="700">+ -</text>

                        {/* Switch */}
                        <g>
                            <circle cx="160" cy="150" r="8" fill="var(--accent-gold)" />
                            {switchOpen ? (
                                <line x1="160" y1="150" x2="180" y2="130" stroke="var(--accent-gold)" strokeWidth="4" />
                            ) : (
                                <line x1="160" y1="150" x2="200" y2="150" stroke="var(--accent-gold)" strokeWidth="4" />
                            )}
                            <circle cx="200" cy="150" r="8" fill="var(--accent-gold)" />
                            <text x="180" y="185" textAnchor="middle" fill="var(--accent-gold)" fontSize="14" fontWeight="900">
                                SWITCH: {switchOpen ? "OPEN" : "CLOSED"}
                            </text>
                        </g>

                        {/* Bulb */}
                        <circle cx="200" cy="80" r="25" fill={isComplete ? "#ffd700" : "#333"} 
                                stroke={isComplete ? "#ffaa00" : "#666"} strokeWidth="3" />
                        {isComplete && (
                            <>
                                <line x1="190" y1="70" x2="210" y2="90" stroke="#fff" strokeWidth="2" />
                                <line x1="210" y1="70" x2="190" y2="90" stroke="#fff" strokeWidth="2" />
                            </>
                        )}

                        <text x="200" y="250" textAnchor="middle" fill={isComplete ? "var(--success-green)" : "var(--error-red)"} 
                              fontSize="16" fontWeight="900">
                            {isComplete ? "✓ Bulb ON!" : "✗ Bulb OFF"}
                        </text>
                    </svg>
                );
            }

            return null;
        }

        // Food Chain Diagram Component
        function FoodChainDiagram({ diagram }) {
            if (!diagram) return null;

            const { chain, highlightArrow } = diagram;

            const icons = {
                sun: '☀️',
                grass: '🌱',
                seaweed: '🌿',
                rabbit: '🐰',
                zebra: '🦓',
                fox: '🦊',
                lion: '🦁',
                'small fish': '🐟',
                shark: '🦈'
            };

            const labels = {
                sun: 'Sun (Energy)',
                grass: 'Grass (Producer)',
                seaweed: 'Seaweed (Producer)',
                rabbit: 'Rabbit (Herbivore)',
                zebra: 'Zebra (Herbivore)',
                fox: 'Fox (Carnivore)',
                lion: 'Lion (Carnivore)',
                'small fish': 'Small Fish (Herbivore)',
                shark: 'Shark (Carnivore)'
            };

            return (
                <svg width="600" height="200" viewBox="0 0 600 200" style={{ margin: '20px auto', display: 'block' }}>
                    <rect width="600" height="200" fill="rgba(10, 30, 60, 0.3)" rx="12" />
                    
                    {chain.map((organism, index) => {
                        const x = 80 + (index * 140);
                        const y = 100;

                        return (
                            <g key={index}>
                                {/* Organism circle */}
                                <circle cx={x} cy={y} r="35" fill="rgba(0, 212, 255, 0.2)" 
                                        stroke="var(--electric-blue)" strokeWidth="3" />
                                <text x={x} y={y + 10} textAnchor="middle" fontSize="32">{icons[organism]}</text>
                                <text x={x} y={y + 55} textAnchor="middle" fill="var(--cyber-blue)" 
                                      fontSize="12" fontWeight="700">{labels[organism]}</text>

                                {/* Arrow to next */}
                                {index < chain.length - 1 && (
                                    <g>
                                        <line x1={x + 40} y1={y} x2={x + 95} y2={y} 
                                              stroke={highlightArrow ? "var(--accent-gold)" : "var(--success-green)"} 
                                              strokeWidth={highlightArrow ? "5" : "4"} 
                                              markerEnd="url(#arrowhead)" />
                                        <text x={x + 67} y={y - 10} textAnchor="middle" 
                                              fill={highlightArrow ? "var(--accent-gold)" : "var(--success-green)"} 
                                              fontSize="11" fontWeight="900">
                                            {highlightArrow ? "ENERGY →" : "→"}
                                        </text>
                                    </g>
                                )}
                            </g>
                        );
                    })}

                    {/* Arrow marker definition */}
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                            <polygon points="0 0, 10 3, 0 6" fill="var(--success-green)" />
                        </marker>
                    </defs>
                </svg>
            );
        }

        // ENGLISH QUEST COMPONENT
        function EnglishQuest({ user, onBack }) {
            const [selectedTopic, setSelectedTopic] = useState(null);
            const [currentStory, setCurrentStory] = useState(null);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [isCorrect, setIsCorrect] = useState(null);
            const [coins, setCoins] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [showStory, setShowStory] = useState(true);
            const [questionBank, setQuestionBank] = useState(null);

            const handleTopicClick = (topic) => {
                setSelectedTopic(topic);
                setCurrentQuestionIndex(0);
                setIsCorrect(null);
                setSelectedAnswer(null);
                
                // Load appropriate content based on topic
                if (topic.id === 'short-stories') {
                    const randomStory = SHORT_STORIES[Math.floor(Math.random() * SHORT_STORIES.length)];
                    setCurrentStory(randomStory);
                    setShowStory(true);
                    setQuestionBank(null);
                } else if (topic.id === 'medium-stories') {
                    const randomStory = MEDIUM_STORIES[Math.floor(Math.random() * MEDIUM_STORIES.length)];
                    setCurrentStory(randomStory);
                    setShowStory(true);
                    setQuestionBank(null);
                } else if (topic.id === 'similes-metaphors') {
                    setQuestionBank(SIMILES_METAPHORS_QUESTIONS);
                    setCurrentStory(null);
                } else if (topic.id === 'punctuation') {
                    setQuestionBank(PUNCTUATION_QUESTIONS);
                    setCurrentStory(null);
                } else if (topic.id === 'vocabulary') {
                    setQuestionBank(VOCABULARY_QUESTIONS);
                    setCurrentStory(null);
                }
            };

            const handleAnswer = (choiceIndex) => {
                let correct = false;
                
                if (currentStory) {
                    const question = currentStory.questions[currentQuestionIndex];
                    correct = choiceIndex === question.answer;
                } else if (questionBank) {
                    const question = questionBank[currentQuestionIndex];
                    correct = choiceIndex === question.answer;
                }
                
                setIsCorrect(correct);
                setSelectedAnswer(choiceIndex);
                
                if (correct) {
                    setCoins(coins + selectedTopic.coinsPerQuestion);
                    
                    const stats = getUserStats(user.username);
                    stats.totalCoins += selectedTopic.coinsPerQuestion;
                    storage.set(`stats_${user.username}`, stats);
                }
            };

            const handleNext = () => {
                const maxQuestions = currentStory 
                    ? currentStory.questions.length 
                    : questionBank.length;
                
                if (currentQuestionIndex < maxQuestions - 1) {
                    setCurrentQuestionIndex(currentQuestionIndex + 1);
                    setIsCorrect(null);
                    setSelectedAnswer(null);

                    setCurrentStory(null);
                    setQuestionBank(null);
                    setCurrentQuestionIndex(0);

                                    <p style={{ fontSize: '14px', marginTop: '10px', color: 'var(--cyber-blue)' }}>

                                </div>
