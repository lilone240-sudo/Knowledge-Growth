        // SCIENCE LAB COMPONENT
        function ScienceLab({ user, onBack }) {
            const [selectedTopic, setSelectedTopic] = useState(null);
            const [questionBank, setQuestionBank] = useState(null);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [isCorrect, setIsCorrect] = useState(null);
            const [coins, setCoins] = useState(0);
            const [selectedAnswer, setSelectedAnswer] = useState(null);

            const handleTopicClick = (topic) => {
                setSelectedTopic(topic);
                setCurrentQuestionIndex(0);
                setIsCorrect(null);
                setSelectedAnswer(null);
                
                if (topic.id === 'circuits') {
                    setQuestionBank(CIRCUIT_QUESTIONS);
                } else if (topic.id === 'food-chains') {
                    setQuestionBank(FOOD_CHAIN_QUESTIONS);
                }
            };

            const handleAnswer = (choiceIndex) => {
                const question = questionBank[currentQuestionIndex];
                const correct = choiceIndex === question.answer;
                
                setIsCorrect(correct);
                setSelectedAnswer(choiceIndex);
                
                if (correct) {
                    setCoins(coins + selectedTopic.coinsPerQuestion);
                    
                    const stats = getUserStats(user.username);
                    stats.totalCoins += selectedTopic.coinsPerQuestion;
                    storage.set(`stats_${user.username}`, stats);
                }
            };

            const handleNext = () => {
                if (currentQuestionIndex < questionBank.length - 1) {
                    setCurrentQuestionIndex(currentQuestionIndex + 1);
                    setIsCorrect(null);
                    setSelectedAnswer(null);
                } else {
                    // Complete
                    setSelectedTopic(null);
                    setQuestionBank(null);
                    setCurrentQuestionIndex(0);
                }
            };

            if (!selectedTopic) {
                return (
                    <div className="dashboard">
                        <StarsBackground />
                        <div className="dashboard-header">
                            <button className="logout-button" onClick={onBack}>← Back</button>
                            <div className="welcome-section">
                                <h1>🔬 Science Lab</h1>
                                <div className="subtitle">Explore amazing experiments, {user.name}!</div>
                            </div>
                        </div>

                        <div className="subject-grid">
                            {SCIENCE_TOPICS.map(topic => (
                                <div 
                                    key={topic.id} 
                                    className="subject-card"
                                    onClick={() => handleTopicClick(topic)}
                                >
                                    <span className="subject-icon">{topic.icon}</span>
                                    <h2>{topic.name}</h2>
                                    <p>+{topic.coinsPerQuestion} coins</p>
                                    <p style={{ fontSize: '14px', marginTop: '10px', color: 'var(--cyber-blue)' }}>
                                        {topic.description}
                                    </p>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            if (questionBank) {
                const currentQuestion = questionBank[currentQuestionIndex];
                
                return (
                    <div className="dashboard">
                        <StarsBackground />
                        <div className="dashboard-header">
                            <button className="logout-button" onClick={() => {
                                setSelectedTopic(null);
                                setQuestionBank(null);
                            }}>← Back to Topics</button>
                            <div className="welcome-section">
                                <h1>{selectedTopic.icon} {selectedTopic.name}</h1>
                                <div className="subtitle">
                                    Question {currentQuestionIndex + 1}/{questionBank.length} • {coins} coins earned
                                </div>
                            </div>
                        </div>

                        <div className="content-card" style={{ maxWidth: '900px', margin: '0 auto' }}>
                            {/* Diagram Display */}
                            {currentQuestion.diagram && (
                                <div style={{ marginBottom: '30px' }}>
                                    {selectedTopic.id === 'circuits' && (
                                        <CircuitDiagram diagram={currentQuestion.diagram} />
                                    )}
                                    {selectedTopic.id === 'food-chains' && (
                                        <FoodChainDiagram diagram={currentQuestion.diagram} />
                                    )}
                                </div>
                            )}

                            {/* Question */}
                            <div className="question-container">
                                <div className="question-text">{currentQuestion.q}</div>

                                <div className="answer-choices">
                                    {currentQuestion.choices.map((choice, idx) => (
                                        <button
                                            key={idx}
                                            className={`choice-button ${selectedAnswer === idx ? 'selected' : ''}`}
                                            onClick={() => handleAnswer(idx)}
                                            disabled={isCorrect !== null}
                                        >
                                            {choice}
                                        </button>
                                    ))}
                                </div>

                                {isCorrect === true && (
                                    <div className="feedback-correct">
                                        <div className="feedback-text">🎉 Excellent! That's correct!</div>
                                        <div className="feedback-explanation">
                                            {currentQuestion.explanation && (
                                                <div style={{ marginTop: '10px', fontSize: '15px' }}>
                                                    ✓ {currentQuestion.explanation}
                                                </div>
                                            )}
                                            You earned {selectedTopic.coinsPerQuestion} coins! 🪙
                                        </div>
                                    </div>
                                )}

                                {isCorrect === false && (
                                    <div className="feedback-incorrect">
                                        <div className="feedback-text">Not quite right. Let's try again!</div>
                                        <div className="feedback-explanation">
                                            {currentQuestion.explanation && (
                                                <div style={{ marginTop: '10px', fontSize: '15px' }}>
                                                    💡 {currentQuestion.explanation}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                <div className="action-buttons">
                                    {isCorrect !== null && (
                                        <button className="next-button" onClick={handleNext}>
                                            {currentQuestionIndex < questionBank.length - 1 
                                                ? '→ Next Question' 
                                                : '✓ Complete Topic'}
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return null;
        }

                                </h3>
                                <p style={{ 
                                    color: 'rgba(255,255,255,0.7)', 
                                    fontSize: '14px',
                                    marginBottom: '20px'
                                }}>
                                    Assign any existing topic with one click - Keyzi will see it on his dashboard
                                </p>
                                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px' }}>
                                    {MATH_TOPICS.slice(0, 6).map(topic => (
                                        <button key={topic.id} style={{
                                            padding: '10px 20px',
                                            background: 'rgba(10, 77, 143, 0.3)',
                                            border: '2px solid var(--cyber-blue)',
                                            borderRadius: '8px',
                                            color: '#ffffff',
                                            fontFamily: "'Rajdhani', sans-serif",
                                            fontSize: '14px',
                                            fontWeight: '700',
                                            cursor: 'pointer'
                                        }}>
                                            {topic.icon} {topic.name}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* REPORTS TAB */}
                    {selectedView === 'reports' && (
                        <>
                            {/* Performance Overview Cards */}
                            <div style={{ 
                                display: 'grid', 
                                gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))',
                                gap: '20px',
                                marginBottom: '30px'
                            }}>
                                {/* Math Performance */}
                                <div className="content-card" style={{
                                    background: 'linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(10, 77, 143, 0.2))',
                                    border: '2px solid var(--electric-blue)'
                                }}>
                                    <h3 style={{
                                        fontFamily: "'Orbitron', sans-serif",
                                        fontSize: '18px',
                                        color: 'var(--electric-blue)',
                                        marginBottom: '15px'
                                    }}>
                                        🔢 Math Performance
                                    </h3>
                                    {(() => {
                                        const mathTopics = MATH_TOPICS.map(t => getTopicProgress(selectedKid, t.id));
                                        const totalAnswered = mathTopics.reduce((sum, p) => 
                                            sum + p.beginner.answered + p.intermediate.answered + p.expert.answered, 0);
                                        const totalCorrect = mathTopics.reduce((sum, p) => 
                                            sum + p.beginner.correct + p.intermediate.correct + p.expert.correct, 0);
                                        const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
                                        
                                        return (
                                            <>
                                                <div style={{ fontSize: '48px', fontWeight: '900', color: 'var(--electric-blue)', marginBottom: '10px' }}>
                                                    {accuracy}%
                                                </div>
                                                <div style={{ fontSize: '14px', color: 'rgba(255,255,255,0.8)' }}>
                                                    {totalCorrect} correct out of {totalAnswered} questions
                                                </div>
                                                <div style={{ fontSize: '14px', color: 'var(--cyber-blue)', marginTop: '10px' }}>
                                                    🪙 {kidStats.mathCoins} coins earned
                                                </div>
                                            </>
                                        );
                                    })()}
                                </div>

                                {/* English Performance */}
                                <div className="content-card" style={{
                                    background: 'linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 165, 0, 0.2))',
                                    border: '2px solid var(--accent-gold)'
                                }}>
                                    <h3 style={{
                                        fontFamily: "'Orbitron', sans-serif",
                                        fontSize: '18px',
                                        color: 'var(--accent-gold)',
                                        marginBottom: '15px'
                                    }}>
                                        📚 English Performance
                                    </h3>
                                    <div style={{ fontSize: '48px', fontWeight: '900', color: 'var(--accent-gold)', marginBottom: '10px' }}>
                                        --
                                    </div>
                                    <div style={{ fontSize: '14px', color: 'rgba(255,255,255,0.8)' }}>
                                        Coming soon - tracking in progress
                                    </div>
                                </div>

                                {/* Science Performance */}
                                <div className="content-card" style={{
                                    background: 'linear-gradient(135deg, rgba(0, 255, 136, 0.15), rgba(0, 200, 100, 0.2))',
                                    border: '2px solid var(--success-green)'
                                }}>
                                    <h3 style={{
                                        fontFamily: "'Orbitron', sans-serif",
                                        fontSize: '18px',
                                        color: 'var(--success-green)',
                                        marginBottom: '15px'
                                    }}>
                                        🔬 Science Performance
                                    </h3>
                                    <div style={{ fontSize: '48px', fontWeight: '900', color: 'var(--success-green)', marginBottom: '10px' }}>
                                        --
                                    </div>
                                    <div style={{ fontSize: '14px', color: 'rgba(255,255,255,0.8)' }}>
                                        Coming soon - tracking in progress
                                    </div>
                                </div>
                            </div>

                            {/* Detailed Topic Breakdown */}
                            <div className="content-card" style={{ marginBottom: '30px' }}>
                                <h2 style={{
                                    fontFamily: "'Orbitron', sans-serif",
                                    fontSize: '24px',
                                    color: 'var(--electric-blue)',
                                    marginBottom: '20px'
                                }}>
                                    📊 Topic-by-Topic Breakdown
                                </h2>
                                
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                                    {allTopicsProgress.filter(t => {
                                        const total = t.progress.beginner.answered + t.progress.intermediate.answered + t.progress.expert.answered;
                                        return total > 0; // Only show topics with activity
                                    }).map(topic => {
                                        const totalAnswered = topic.progress.beginner.answered + 
                                                            topic.progress.intermediate.answered + 
                                                            topic.progress.expert.answered;
                                        const totalCorrect = topic.progress.beginner.correct + 
                                                           topic.progress.intermediate.correct + 
                                                           topic.progress.expert.correct;
                                        const overallAccuracy = Math.round((totalCorrect / totalAnswered) * 100);

                                        return (
                                            <div key={topic.id} style={{
                                                padding: '20px',
                                                background: 'rgba(10, 30, 60, 0.6)',
                                                border: '2px solid var(--cyber-blue)',
                                                borderRadius: '12px'
                                            }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
                                                    <div>
                                                        <span style={{ fontSize: '24px', marginRight: '10px' }}>{topic.icon}</span>
                                                        <span style={{ 
                                                            fontFamily: "'Orbitron', sans-serif",
                                                            fontSize: '18px',
                                                            fontWeight: '700',
                                                            color: '#ffffff'
                                                        }}>
                                                            {topic.name}
                                                        </span>
                                                    </div>
                                                    <div style={{
                                                        padding: '8px 16px',
                                                        background: topic.progress.currentLevel === 'beginner' ? 'rgba(0, 255, 136, 0.2)' :
                                                                   topic.progress.currentLevel === 'intermediate' ? 'rgba(255, 215, 0, 0.2)' :
                                                                   'rgba(255, 51, 102, 0.2)',
                                                        border: `2px solid ${topic.progress.currentLevel === 'beginner' ? 'var(--success-green)' :
                                                                             topic.progress.currentLevel === 'intermediate' ? 'var(--accent-gold)' :
                                                                             'var(--error-red)'}`,
                                                        borderRadius: '8px',
                                                        fontSize: '12px',
                                                        fontWeight: '700',
                                                        textTransform: 'uppercase',
                                                        color: topic.progress.currentLevel === 'beginner' ? 'var(--success-green)' :
                                                               topic.progress.currentLevel === 'intermediate' ? 'var(--accent-gold)' :
                                                               'var(--error-red)'
                                                    }}>
                                                        {topic.progress.currentLevel}
                                                    </div>
                                                </div>

                                                {/* Progress by Level */}
                                                <div style={{ 
                                                    display: 'grid', 
                                                    gridTemplateColumns: 'repeat(3, 1fr)', 
                                                    gap: '15px',
                                                    marginBottom: '15px'
                                                }}>
                                                    {['beginner', 'intermediate', 'expert'].map(level => {
                                                        const levelData = topic.progress[level];
                                                        const levelAcc = levelData.answered > 0 
                                                            ? Math.round((levelData.correct / levelData.answered) * 100) 
                                                            : 0;
                                                        
                                                        return (
                                                            <div key={level} style={{
                                                                padding: '12px',
                                                                background: 'rgba(0, 212, 255, 0.05)',
                                                                borderRadius: '8px',
                                                                border: '1px solid rgba(0, 212, 255, 0.3)'
                                                            }}>
                                                                <div style={{ 
                                                                    fontSize: '11px', 
                                                                    color: 'var(--cyber-blue)', 
                                                                    textTransform: 'uppercase',
                                                                    marginBottom: '5px',
                                                                    fontWeight: '700'
                                                                }}>
                                                                    {level}
                                                                </div>
                                                                <div style={{ fontSize: '20px', fontWeight: '900', color: '#fff' }}>
                                                                    {levelData.answered > 0 ? `${levelAcc}%` : '--'}
                                                                </div>
                                                                <div style={{ fontSize: '12px', color: 'rgba(255,255,255,0.7)' }}>
                                                                    {levelData.correct}/{levelData.answered}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>

                                                {/* Overall Stats */}
                                                <div style={{ 
                                                    display: 'flex', 
                                                    justifyContent: 'space-around',
                                                    paddingTop: '15px',
                                                    borderTop: '1px solid rgba(0, 212, 255, 0.3)'
                                                }}>
                                                    <div>
                                                        <div style={{ fontSize: '12px', color: 'var(--cyber-blue)' }}>Overall Accuracy</div>
                                                        <div style={{ 
                                                            fontSize: '24px', 
                                                            fontWeight: '900',
                                                            color: overallAccuracy >= 80 ? 'var(--success-green)' : 
                                                                   overallAccuracy >= 60 ? 'var(--accent-gold)' : 'var(--error-red)'
                                                        }}>
                                                            {overallAccuracy}%
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div style={{ fontSize: '12px', color: 'var(--cyber-blue)' }}>Total Questions</div>
                                                        <div style={{ fontSize: '24px', fontWeight: '900', color: '#fff' }}>
                                                            {totalAnswered}
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <div style={{ fontSize: '12px', color: 'var(--cyber-blue)' }}>Best Streak</div>
                                                        <div style={{ fontSize: '24px', fontWeight: '900', color: 'var(--accent-gold)' }}>
                                                            🔥 {topic.progress.bestStreak}
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Recommendation */}
                                                {overallAccuracy < 70 && (
                                                    <div style={{
                                                        marginTop: '15px',
                                                        padding: '12px',
                                                        background: 'rgba(255, 215, 0, 0.1)',
                                                        border: '2px solid var(--accent-gold)',
                                                        borderRadius: '8px',
                                                        fontSize: '14px',
                                                        color: 'var(--accent-gold)'
                                                    }}>
                                                        💡 <strong>Recommendation:</strong> This topic needs more practice. Consider spending 10-15 minutes daily here.
                                                    </div>
                                                )}
                                                {overallAccuracy >= 90 && (
                                                    <div style={{
                                                        marginTop: '15px',
                                                        padding: '12px',
                                                        background: 'rgba(0, 255, 136, 0.1)',
                                                        border: '2px solid var(--success-green)',
                                                        borderRadius: '8px',
                                                        fontSize: '14px',
                                                        color: 'var(--success-green)'
                                                    }}>
                                                        🌟 <strong>Excellent!</strong> Keyzi has mastered this topic. Ready for more challenges!
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Insights & Recommendations */}
                            <div className="content-card">
                                <h2 style={{
                                    fontFamily: "'Orbitron', sans-serif",
                                    fontSize: '24px',
                                    color: 'var(--electric-blue)',
                                    marginBottom: '20px'
                                }}>
                                    💡 Insights & Recommendations
                                </h2>
                                
                                {(() => {
                                    const topicsWithActivity = allTopicsProgress.filter(t => {
                                        const total = t.progress.beginner.answered + t.progress.intermediate.answered + t.progress.expert.answered;
                                        return total > 0;
                                    });

                                    const strengths = topicsWithActivity.filter(t => {
                                        const total = t.progress.beginner.answered + t.progress.intermediate.answered + t.progress.expert.answered;
                                        const correct = t.progress.beginner.correct + t.progress.intermediate.correct + t.progress.expert.correct;
                                        return total > 5 && (correct / total) >= 0.85;
                                    });

                                    const needsPractice = topicsWithActivity.filter(t => {
                                        const total = t.progress.beginner.answered + t.progress.intermediate.answered + t.progress.expert.answered;
                                        const correct = t.progress.beginner.correct + t.progress.intermediate.correct + t.progress.expert.correct;
                                        return total > 3 && (correct / total) < 0.7;
                                    });

                                    return (
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                                            {/* Strengths */}
                                            {strengths.length > 0 && (
                                                <div style={{
                                                    padding: '20px',
                                                    background: 'rgba(0, 255, 136, 0.1)',
                                                    border: '2px solid var(--success-green)',
                                                    borderRadius: '12px'
                                                }}>
                                                    <h3 style={{ color: 'var(--success-green)', marginBottom: '15px', fontSize: '18px' }}>
                                                        🌟 Strengths (85%+ accuracy)
                                                    </h3>
                                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px' }}>
                                                        {strengths.map(t => (
                                                            <span key={t.id} style={{
                                                                padding: '8px 16px',
                                                                background: 'rgba(0, 255, 136, 0.2)',
                                                                borderRadius: '20px',
                                                                fontSize: '14px',
                                                                color: 'var(--success-green)',
                                                                fontWeight: '700'
                                                            }}>
                                                                {t.icon} {t.name}
                                                            </span>
                                                        ))}
                                                    </div>
                                                    <p style={{ marginTop: '15px', fontSize: '14px', color: 'rgba(255,255,255,0.9)' }}>
                                                        Keyzi is excelling in these areas! Consider introducing more challenging problems or moving to the next difficulty level.
                                                    </p>
                                                </div>
                                            )}

                                            {/* Needs Practice */}
                                            {needsPractice.length > 0 && (
                                                <div style={{
                                                    padding: '20px',
                                                    background: 'rgba(255, 215, 0, 0.1)',
                                                    border: '2px solid var(--accent-gold)',
                                                    borderRadius: '12px'
                                                }}>
                                                    <h3 style={{ color: 'var(--accent-gold)', marginBottom: '15px', fontSize: '18px' }}>
                                                        📖 Focus Areas (below 70% accuracy)
                                                    </h3>
                                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px' }}>
                                                        {needsPractice.map(t => (
                                                            <span key={t.id} style={{
                                                                padding: '8px 16px',
                                                                background: 'rgba(255, 215, 0, 0.2)',
                                                                borderRadius: '20px',
                                                                fontSize: '14px',
                                                                color: 'var(--accent-gold)',
                                                                fontWeight: '700'
                                                            }}>
                                                                {t.icon} {t.name}
                                                            </span>
                                                        ))}
                                                    </div>
                                                    <p style={{ marginTop: '15px', fontSize: '14px', color: 'rgba(255,255,255,0.9)' }}>
                                                        These topics could benefit from additional practice. Try 10-15 minute focused sessions, using the two-tier hints for support.
                                                    </p>
                                                </div>
                                            )}

                                            {/* General Stats */}
                                            <div style={{
                                                padding: '20px',
                                                background: 'rgba(10, 77, 143, 0.2)',
                                                border: '2px solid var(--cyber-blue)',
                                                borderRadius: '12px'
                                            }}>
                                                <h3 style={{ color: 'var(--cyber-blue)', marginBottom: '15px', fontSize: '18px' }}>
                                                    📈 Overall Progress
                                                </h3>
                                                <ul style={{ 
                                                    listStyle: 'none', 
                                                    padding: 0,
                                                    display: 'flex',
                                                    flexDirection: 'column',
                                                    gap: '10px',
                                                    color: 'rgba(255,255,255,0.9)',
                                                    fontSize: '15px',
                                                    lineHeight: '1.6'
                                                }}>
                                                    <li>📊 Active in <strong>{topicsWithActivity.length}</strong> topics across Math</li>
                                                    <li>🔥 Current streak: <strong>{kidStats.currentStreak}</strong> days (best: {kidStats.longestStreak})</li>
                                                    <li>🪙 Total coins earned: <strong>{kidStats.totalCoins}</strong></li>
                                                    <li>🎯 Cambridge Checkpoint exam: <strong>April 2026</strong> - {Math.floor((new Date('2026-04-01') - new Date()) / (1000 * 60 * 60 * 24))} days to go!</li>
                                                </ul>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        function App() {
            const [user, setUser] = useState(null);
            const [currentModule, setCurrentModule] = useState(null);

            if (!user) {
                return <Login onLogin={setUser} />;
            }

            // Parent gets different dashboard
            if (user.type === 'parent') {
                return (
                    <ParentDashboard 
                        user={user} 
                        onLogout={() => setUser(null)}
                    />
                );
            }

            // Kid continues to normal dashboard
            if (currentModule === 'math') {
                return <MathQuest user={user} onBack={() => setCurrentModule(null)} />;
            }

            if (currentModule === 'english') {
                return <EnglishQuest user={user} onBack={() => setCurrentModule(null)} />;
            }

            if (currentModule === 'science') {
                return <ScienceLab user={user} onBack={() => setCurrentModule(null)} />;
            }

            return (
                <Dashboard 
                    user={user} 
                    onLogout={() => setUser(null)}
                    onSelectSubject={(id) => setCurrentModule(id)}
                />
            );
        }

        ReactDOM.render(<App />, document.getElementById('app'));
    </script>
</body>
</html>
